# Generates the animated contribution snake (dark + light) and publishes both SVGs
# to the `output` branch. The README embeds them from:
#   https://raw.githubusercontent.com/yash-1105/yash-1105/output/github-snake-dark.svg
#   https://raw.githubusercontent.com/yash-1105/yash-1105/output/github-snake.svg
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"        # daily, 00:00 UTC
  workflow_dispatch:           # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yash-1105
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#1E293B,#312E81,#4338CA,#6366F1,#A5B4FC
            dist/github-snake.svg?palette=github-light&color_snake=#0E7490&color_dots=#E2E8F0,#C7D2FE,#A5B4FC,#6366F1,#3730A3

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
